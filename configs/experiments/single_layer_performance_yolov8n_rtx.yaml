model:
  checkpoint: models/checkpoints/yolov8/train3/weights/best.pt
data:
  dataset_yaml: data/camel/camel.yaml
  split: val
experiment:
  model_variant: yolov8n
  hardware_label: rtx3070
  image_size: 352
  num_classes: 4
  seed: 7
  batch_size: 1
  output_dir: runs/experiments/single_layer_performance_screening/yolov8n/rtx3070
runtime:
  device: "0"
  precision: fp32
  conf: 0.25
  iou: 0.6
screening:
  warmup: 20
  iterations: 100
  layer_patterns:
    # Backbone
    - model.4.m.1.cv1.conv
    - model.5.conv
    - model.6.m.0.cv1.conv
    - model.6.m.1.cv1.conv
    - model.7.conv
    - model.8.cv2.conv
    - model.8.m.0.cv1.conv
    - model.9.cv2.conv
    # Neck
    - model.12.m.0.cv1.conv
    - model.15.m.0.cv1.conv
    - model.16.conv
    - model.18.cv2.conv
    - model.18.m.0.cv1.conv
    - model.19.conv
    - model.21.cv2.conv
    - model.21.m.0.cv1.conv
