model:
  checkpoint: models/baseline/yolov8/train/weights/best.pt

data:
  dataset_yaml: data/camel/camel.yaml

experiment:
  image_size: 352
  num_classes: 4
  seed: 7
  batch_size: 1
  output_dir: runs/experiments/cluster_pruning_screening

runtime:
  device: 0
  precision: fp16
  conf: 0.25
  iou: 0.6

pruning:
  protected_layers: [model.0, model.22]
  candidate_layers:
    # Backbone
    - model.4.m.1.cv1.conv
    - model.5.conv
    - model.6.m.0.cv1.conv
    - model.6.m.1.cv1.conv
    - model.7.conv
    - model.8.cv2.conv
    - model.8.m.0.cv1.conv
    - model.9.cv2.conv
    # Neck
    - model.12.m.0.cv1.conv
    - model.15.m.0.cv1.conv
    - model.16.conv
    - model.18.cv2.conv
    - model.18.m.0.cv1.conv
    - model.19.conv
    - model.21.cv2.conv
    - model.21.m.0.cv1.conv
  cluster_sizes: [4, 8, 16, 32]
  probe_ratios: [0.05]
