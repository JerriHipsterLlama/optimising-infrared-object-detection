model:
  checkpoint: models/baseline/yolov8/train/weights/best.pt

data:
  dataset_yaml: data/camel/camel.yaml

experiment:
  image_size: 336
  num_classes: 4
  seed: 7
  batch_size: 1
  output_dir: runs/experiments/cluster_pruning_rtx_screening

runtime:
  device: 0
  precision: fp16
  conf: 0.25
  iou: 0.6

pruning:
  protected_layers: [model.0, model.22]
  safe_layers: [model.4.cv2.conv, model.6.cv2.conv, model.8.cv2.conv]
  cluster_sizes: [8, 16, 32]
  probe_ratios: [0.05]
  global_ratios: [0.10, 0.20, 0.30]
  fine_tune_epochs: 5

screening:
  max_map50_95_drop: 0.02
  minimum_serialized_reduction: 0.0

targets:
  rtx_screening_device: 0
  orin_target: jetson_orin_nano
  orin_execution_device: '0'

export:
  format: engine
