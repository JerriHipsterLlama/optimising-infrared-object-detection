model:
  checkpoint: models/baseline/yolov8/train/weights/best.pt
  architecture: yolov8n

data:
  dataset_yaml: data/camel/camel.yaml
  calibration_image_dir: data/camel/images/train

precisions: [fp32, fp16, int8]

pruning:
  enabled: true
  filterwise_manifest: artifacts/filterwise_rtx_screening/manifest.json
  evidence_layer: model.8.cv2.conv
  candidate_layers:
    - model.0.conv
    - model.2.cv2.conv
    - model.4.cv2.conv
    - model.6.cv2.conv
    - model.8.cv2.conv
  cluster_size: 8
  evidence_filters_removed: 8
  prune_ratios: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  allowed_map50_95_drop: 0.02
  importance: minimum_weight

experiment:
  output_dir: runs/experiments/rtx_compression_matrix
  seed: 7

runtime:
  device: rtx
