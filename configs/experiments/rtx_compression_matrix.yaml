model:
  checkpoint: models/baseline/yolov8/train/weights/best.pt
  architecture: yolov8n

data:
  dataset_yaml: data/camel/camel.yaml
  calibration_image_dir: data/camel/images/train

precisions: [fp32, fp16]

pruning:
  enabled: true
  candidate_layers:
    - model.4.cv2.conv
    - model.6.cv2.conv
    - model.8.cv2.conv
    - model.12.cv2.conv
    - model.15.cv2.conv
    - model.18.cv2.conv
    - model.21.cv2.conv
  cluster_size: 8
  prune_ratios: [0.10, 0.20, 0.30, 0.40, 0.50]
  allowed_map50_95_drop: 0.02
  importance: minimum_weight

experiment:
  output_dir: runs/experiments/rtx_compression_matrix
  image_size: 352
  seed: 7

runtime:
  device: rtx
  # Ultralytics' TensorRT backend maps the CPU selector to CUDA for .engine files.
  # This avoids the intermittent PyTorch numeric-device visibility failure on Windows.
  evaluation_device: cpu
