models:
  directory: runs/experiments/jetson_compression_matrix
  pattern: "**/model.onnx"

testing:
  # Use "python" for RTX quality screening; use "both" on the Jetson for
  # Python quality metrics plus native C++ TensorRT latency.
  backend: python
  dataset_yaml: data/camel/camel.yaml
  split: test
  image_size: 352
  device: "0"
  confidence: 0.25
  iou: 0.70
  output_dir: runs/experiments/model_testing_matrix/rtx3070
  hardware_label: rtx3070
  workspace_mb: 2048
  runner: deploy/jetson/build/jetson_benchmark
  image_dir: data/camel/images/test
  warmup: 20
  iterations: 100
