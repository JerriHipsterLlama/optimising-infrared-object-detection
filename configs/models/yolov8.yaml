# YOLOv8n Training Configuration
# Optimized for infrared object detection on CAMEL dataset
# Image size: 336x256, Grayscale

model:
  name: "yolov8m"
  pretrained: true
  img_size: 336  # Native CAMEL image width (336x256 aspect ratio)
  device: 0  # GPU device index (0 for single GPU)

training:
  epochs: 200  # Increased from 100 to 200 for thermal data convergence (Ding et al., 2024)
  batch_size: 32  # Auto batch size based on GPU memory (Ultralytics default)
  learning_rate: 0.01  # Increased from 0.001 to 0.01 for thermal detection (Ding et al., 2024)
  momentum: 0.937  # SGD momentum (standard YOLOv8 default)
  weight_decay: 0.0005  # L2 regularization (standard YOLOv8 default)
  warmup_epochs: 3
  optimizer: "SGD"
  patience: 30  # Early stopping patience

  num_workers: 4  # DataLoader workers
  
  # EMA (Exponential Moving Average)
  ema: true
  ema_tau: 0.999

data:
  dataset_path: "data/camel"
  train_split: "train"
  val_split: "val"
  test_split: "test"
  num_workers: 6
  pin_memory: true
  
  # For YOLO, need to specify number of classes
  nc: 4  # Number of classes: person, bicycle, vehicle, dog
  names: ["person", "bicycle", "vehicle", "dog"]  # Class names

augmentation:
  # Ultralytics YOLOv8n defaults for infrared object detection
  # These must be synchronized with configs/models/faster_rcnn.yaml
  
  # Rotation degrees (±rotation)
  degrees: 15.0
  
  # HSV color adjustments
  hsv_h: 0.0  # Hue (not used for grayscale thermal)
  hsv_v: 0.4    # Value → Brightness adjustment
  hsv_s: 0.0    # Saturation → Contrast adjustment (unused for grayscale)
  
  # Geometric transformations
  translate: 0.1  # ±10% translation
  scale: 0.5      # Scale range: 0.5 to 1.5
  
  # Flipping
  fliplr: 0.5     # Horizontal flip probability (50%)
  flipud: 0.0     # Vertical flip probability (0% - disabled for thermal)
  
  # Occlusion/Cutout
  erasing: 0    # Cutout probability (40%)
  
  # Batch augmentation (applied at batch level in YOLOv8)
  mosaic: 1.0     # Mosaic augmentation mixing ratio

checkpoint:
  save_interval: 5    # Save checkpoint every N epochs
  resume_from: "models/checkpoints/yolov8"   # Path to checkpoint directory
  save_best: true     # Save best model
  save_last: true     # Save last model

logging:
  log_file: "logs/train_yolov8.log"
  log_interval: 10  # Log metrics every N batches
  save_metrics: true
  metrics_file: "logs/yolov8_metrics.json"
  tensorboard: false  # Use tensorboard logging

validation:
  val_interval: 5  # Validate every N epochs
  conf_threshold: 0.25  # Confidence threshold for validation
  iou_threshold: 0.6   # IoU threshold for NMS

export:
  onnx: true
  onnx_opset: 14
  onnx_path: "models/weights/yolov8n.onnx"
  
  tensorrt: false  # Requires CUDA
  tensorrt_path: "models/weights/yolov8n.trt"
